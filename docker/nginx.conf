server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión de estáticos
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Fallback de vue-router (history mode): cualquier ruta desconocida
    # (/profile, /admin, etc.) devuelve index.html en lugar de 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cachea agresivamente los assets con hash (JS/CSS/imagenes de /assets)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # No cachear el HTML (para que tome nuevos deploys al instante)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
